name: Build (Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  OBS_VERSION: 32.2.2
  DFN_COMMIT: d375b2d

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances (OBS PPA, Qt6)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio libsimde-dev qt6-base-dev cmake ninja-build build-essential

      - name: DeepFilterNet (libDF)
        run: |
          git clone https://github.com/Rikorose/DeepFilterNet.git ../DeepFilterNet
          cd ../DeepFilterNet && git checkout $DFN_COMMIT
          cargo build --release -p deep_filter --no-default-features --features capi --lib

      - name: Build + tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Paquet
        run: |
          cmake --install build --prefix pkg
          tar -C pkg -czf gragarda-voice-linux-x86_64.tar.gz gragarda-voice

      - uses: actions/upload-artifact@v4
        with:
          name: gragarda-voice-linux-x86_64
          path: gragarda-voice-linux-x86_64.tar.gz
