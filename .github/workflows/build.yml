name: Build (Linux, macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  OBS_VERSION: 32.2.2
  DFN_COMMIT: d375b2d

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances (OBS PPA, Qt6)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio qt6-base-dev cmake ninja-build build-essential

      - name: DeepFilterNet (libDF)
        run: |
          git clone https://github.com/Rikorose/DeepFilterNet.git ../DeepFilterNet
          cd ../DeepFilterNet && git checkout $DFN_COMMIT
          cargo build --release -p deep_filter --no-default-features --features capi --lib

      - name: Build + tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Paquet
        run: |
          cmake --install build --prefix pkg
          tar -C pkg -czf gragarda-voice-linux-x86_64.tar.gz gragarda-voice

      - uses: actions/upload-artifact@v4
        with:
          name: gragarda-voice-linux-x86_64
          path: gragarda-voice-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: libobs ${{ env.OBS_VERSION }} (sources)
        run: |
          git clone --depth 1 --branch $OBS_VERSION --recurse-submodules --shallow-submodules \
            https://github.com/obsproject/obs-studio.git ../obs-studio
          cd ../obs-studio
          cmake --preset macos -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF -DENABLE_SCRIPTING=OFF
          cmake --build --preset macos --config RelWithDebInfo --target libobs

      - name: DeepFilterNet (libDF universel)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          git clone https://github.com/Rikorose/DeepFilterNet.git ../DeepFilterNet
          cd ../DeepFilterNet && git checkout $DFN_COMMIT
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            MACOSX_DEPLOYMENT_TARGET=12.0 cargo build --release -p deep_filter --no-default-features \
              --features capi --lib --target $t
          done
          mkdir -p target/release
          lipo -create target/aarch64-apple-darwin/release/libdf.a target/x86_64-apple-darwin/release/libdf.a \
            -output target/release/libdf.a

      - name: Build + tests
        run: |
          OBS=$(cd ../obs-studio && pwd)
          DEPS=$(ls -d $OBS/.deps/obs-deps-20*-universal | head -1)
          QT=$(ls -d $OBS/.deps/obs-deps-qt6-*-universal | head -1)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$OBS/build_macos;$DEPS;$QT" \
            -DCMAKE_FRAMEWORK_PATH="$OBS/build_macos/libobs/RelWithDebInfo" \
            -DCMAKE_MODULE_PATH="$OBS/cmake/finders"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Paquet
        run: |
          cmake --install build --prefix pkg
          cd pkg && zip -qry ../gragarda-voice-macos-universal.zip gragarda-voice.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: gragarda-voice-macos-universal
          path: gragarda-voice-macos-universal.zip
